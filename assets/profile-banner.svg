<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="344" viewBox="0 0 1040 344" role="img" aria-labelledby="title desc">
  <title id="title">Khalil Haidar | Build. Run. Repeat.</title>
  <desc id="desc">Mint signals flow from source and image nodes into a running container.</desc>
  <style>
    .signal { animation: transit 2.8s linear infinite; }
    .signal-b { animation-delay: -1.4s; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
    @keyframes transit { to { stroke-dashoffset: -260; } }
    @keyframes pulse {
      0%, 100% { transform: scale(.55); opacity: .9; }
      72%, 99% { transform: scale(2.8); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .pulse { animation: none; }
      .pulse { opacity: .45; }
    }
  </style>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#263331" stroke-opacity=".66"/>
    </pattern>
    <radialGradient id="light">
      <stop stop-color="#165544" stop-opacity=".62"/>
      <stop offset="1" stop-color="#101a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#214c40"/>
      <stop offset="1" stop-color="#112b26"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1040" height="344" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="#101614" d="M0 0h1040v344H0z"/>
    <path fill="#131e1b" d="M544 0h496v344H544z"/>
    <path fill="url(#grid)" d="M544 0h496v344H544z"/>
    <ellipse cx="838" cy="173" rx="244" ry="190" fill="url(#light)"/>
    <path d="M544 0v344M43 68h460m-460 199h460" stroke="#30403b"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
      <circle cx="49" cy="40" r="4" fill="#96ffd0" filter="url(#glow)"/>
      <text x="66" y="46" fill="#a6f6cf">@KHALIL1400</text>
      <text x="44" y="305" fill="#a6f6cf">DEVOPS</text>
      <text x="129" y="305" fill="#6a8178">/</text>
      <text x="150" y="305" fill="#dae6de">FULL-STACK DEVELOPMENT</text>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800">
      <text x="40" y="142" font-size="61" fill="#f2faf5">Khalil Haidar</text>
      <text x="41" y="221" font-size="51" fill="#a6f6cf">Build. Run. Repeat.</text>
    </g>
    <g fill="none" stroke="#467163" stroke-width="2">
      <path d="M668 103h56v45h66M668 237h56v-52h66M870 164h100"/>
      <path class="signal" d="M668 103h56v45h66" pathLength="260" stroke="#b6ffdc" stroke-width="3" stroke-dasharray="22 238" filter="url(#glow)"/>
      <path class="signal signal-b" d="M668 237h56v-52h66" pathLength="260" stroke="#ffd184" stroke-width="3" stroke-dasharray="22 238" filter="url(#glow)"/>
      <path class="signal signal-b" d="M870 164h100" pathLength="260" stroke="#b6ffdc" stroke-width="3" stroke-dasharray="28 232" filter="url(#glow)"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">
      <rect x="572" y="83" width="96" height="40" rx="4" fill="#111c18" stroke="#44695b"/>
      <text x="620" y="109" text-anchor="middle" fill="#dcece3">SOURCE</text>
      <rect x="572" y="217" width="96" height="40" rx="4" fill="#1b1b15" stroke="#795c33"/>
      <text x="620" y="243" text-anchor="middle" fill="#ffd184">IMAGE</text>
      <text x="827" y="245" text-anchor="middle" fill="#a6f6cf">CONTAINER</text>
      <text x="970" y="200" text-anchor="middle" fill="#a6f6cf">LIVE</text>
    </g>
    <g stroke="#95e2bb" stroke-width="1.6" stroke-linejoin="round">
      <path d="m771 141 56-29 55 29-55 29z" fill="#306452"/>
      <path d="M771 141v55l56 29v-55z" fill="url(#face)"/>
      <path d="m827 170 55-29v55l-55 29z" fill="#15362e"/>
      <path d="m785 164 27 14m-27-4 27 14m-27-4 27 14m29-22 28-14m-28 24 28-14m-28 24 28-14" fill="none"/>
    </g>
    <circle class="pulse" cx="970" cy="164" r="8" fill="none" stroke="#96ffd0" stroke-width="2"/>
    <circle cx="970" cy="164" r="5" fill="#96ffd0" filter="url(#glow)"/>
    <rect x=".5" y=".5" width="1039" height="343" rx="8" fill="none" stroke="#44544e"/>
  </g>
</svg>
